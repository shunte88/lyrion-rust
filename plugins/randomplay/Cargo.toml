[workspace]

[package]
name = "lyrion-plugin-randomplay"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
lyrion-plugins = { path = "../../crates/lyrion-plugins" }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
rand = "0.8"
