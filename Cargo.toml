[workspace]
resolver = "2"
members = [
    "crates/lyrion-core",
    "crates/lyrion-db",
    "crates/lyrion-formats",
    "crates/lyrion-transcode",
    "crates/lyrion-protocol",
    "crates/lyrion-plugins",
    "crates/lyrion-server",
    "crates/lyrion-scanner",
]
exclude = [
    "plugins/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"
authors = ["Lyrion Community"]
repository = "https://github.com/LMS-Community/slimserver"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
duckdb = { version="1.0", features = ["bundled"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Audio parsing
lofty = "0.21"
symphonia = { version = "0.5", features = ["all"] }

# Binary parsing
nom = "7.1"
bytes = "1.7"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Plugin system
libloading = "0.8"
wasmtime = "26.0"

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"

# Testing
mockall = "0.13"
